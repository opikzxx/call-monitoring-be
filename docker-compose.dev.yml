# Fully containerized dev environment: db + app with hot-reload.
services:
  db:
    image: postgres:16-alpine
    container_name: callmonitoring-backend-db
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: callmonitoring-backend-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      # Bind mount source for hot-reload
      - ./:/app
      # Keep the container's own build output out of the bind mount
      - /app/build
      # Persist Gradle wrapper/dependency cache across restarts
      - gradle_cache:/root/.gradle
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  gradle_cache:
